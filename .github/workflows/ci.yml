name: CI — Lint, Tests & Evaluation Regression Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify-pipeline:
    name: Lint, Unit/Integration Tests & CI Eval Subset
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tesseract OCR (English + German) & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-deu \
            fonts-dejavu-core \
            fonts-liberation

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip==24.3.1 setuptools==75.8.0 wheel==0.45.1
          pip install -r requirements.txt
          pip install --no-build-isolation --no-deps -e .

      - name: Run Ruff static analysis
        run: ruff check src tests scripts

      - name: Generate deterministic synthetic dataset (seed=42)
        run: python -m doc_pipeline.synthetic.generator --count 200 --seed 42 --output-dir ./data/synthetic

      - name: Run unit, integration, and CI regression test suite
        run: pytest -v

      - name: Run standalone CI evaluation harness gate (Vision vs OCR fallback)
        run: |
          python -m doc_pipeline.eval.runner \
            --subset ci \
            --in-process-mock \
            --compare-ocr \
            --fail-on-regression \
            --min-field-f1 0.92 \
            --min-line-f1 0.90 \
            --min-anomaly-recall 1.00 \
            --output-json ./data/exports/ci-eval-report.json

      - name: Upload CI evaluation report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-eval-report
          path: ./data/exports/ci-eval-report.json
