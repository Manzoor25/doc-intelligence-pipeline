[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intelligence-pipeline"
version = "0.1.0"
description = "Accounts Payable Document Intelligence Pipeline over any OpenAI-compatible LLM endpoint"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Manzooruddin Mohammed" }]
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "SQLAlchemy==2.1.8",
    "psycopg[binary]==3.3.8",
    "openai==3.48.0",
    "httpx==0.28.1",
    "minio==7.2.20",
    "pypdfium2==5.15.2",
    "pillow==13.0.0",
    "numpy==2.5.4",
    "reportlab==5.1.0",
    "pytesseract==0.3.13",
    "RapidFuzz==3.14.6",
    "Jinja2==3.1.6",
    "python-multipart==0.0.33",
    "watchfiles==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
